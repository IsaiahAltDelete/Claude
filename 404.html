<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>404 — Not found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%23000%22/%3E%3Crect x=%227%22 y=%227%22 width=%2218%22 height=%2218%22 rx=%223%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222.4%22/%3E%3C/svg%3E">

<style>
  /* --------------------------------------------------------------------
     Minimal white-on-black index. Self-contained: no fonts, no scripts,
     no requests beyond the favicon.
     -------------------------------------------------------------------- */
  :root {
    --fg: #fff;
    --dim: #8a8a8a;      /* 6.1:1 on black */
    --faint: #757575;    /* 4.6:1 — the dimmest tone still used for text */
    --decor: #3a3a3a;    /* non-text only: arrows, separators */
    --hair: #1f1f1f;
    --bg: #000;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: #fff; color: #000; }

  a { color: inherit; text-decoration: none; }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(48px, 12vh, 132px) 24px 72px;
  }

  /* ------------------------------------------------------------ header */

  header { margin-bottom: clamp(40px, 9vh, 84px); }

  h1 {
    margin: 0;
    font-size: clamp(30px, 6.4vw, 46px);
    font-weight: 500;
    letter-spacing: -0.035em;
    line-height: 1.05;
  }

  .tagline {
    margin: 14px 0 0;
    max-width: 46ch;
    color: var(--dim);
    font-size: 14.5px;
  }

  /* -------------------------------------------------------------- list */

  .label {
    margin: 0 0 6px;
    color: var(--faint);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .index { border-top: 1px solid var(--hair); }

  .entry {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    gap: 0 16px;
    align-items: baseline;
    padding: 22px 4px 24px;
    border-bottom: 1px solid var(--hair);
    transition: background 0.18s ease, padding-left 0.18s ease;
  }

  a.entry:hover,
  a.entry:focus-visible {
    background: #0b0b0b;
    padding-left: 12px;
    outline: 0;
  }
  a.entry:focus-visible { box-shadow: inset 2px 0 0 #fff; }

  .num {
    color: var(--faint);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .entry h2 {
    margin: 0;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.015em;
  }

  .entry p {
    margin: 7px 0 0;
    max-width: 52ch;
    color: var(--dim);
    font-size: 14px;
  }

  .meta {
    margin: 11px 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    color: var(--faint);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
  }

  /* Middots between meta items, so they don't read as one run of text. */
  .meta span + span::before { content: "·"; margin-right: 10px; color: var(--decor); }

  .status {
    align-self: baseline;
    padding: 3px 9px;
    border: 1px solid var(--hair);
    border-radius: 999px;
    color: var(--dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    white-space: nowrap;
  }
  .status.live { border-color: #2b2b2b; color: #fff; }

  .arrow {
    display: inline-block;
    margin-left: 8px;
    color: var(--decor);
    transition: transform 0.18s ease, color 0.18s ease;
  }
  a.entry:hover .arrow, a.entry:focus-visible .arrow { transform: translateX(4px); color: #fff; }

  /* Placeholder row for work that has not shipped anything to look at. */
  .entry.empty { color: var(--faint); }
  .entry.empty h2 { color: var(--faint); font-weight: 400; }

  /* ------------------------------------------------------------ footer */

  footer {
    margin-top: clamp(40px, 9vh, 76px);
    color: var(--faint);
    font-size: 12.5px;
  }
  footer a { border-bottom: 1px solid var(--hair); }
  footer a:hover { color: #fff; border-bottom-color: #666; }

  @media (max-width: 560px) {
    .entry { grid-template-columns: 24px 1fr; gap: 0 12px; }
    .status { grid-column: 2; margin-top: 12px; justify-self: start; }
    .entry h2 { font-size: 17.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>Not&nbsp;here</h1>
    <p class="tagline">That page does not exist. Everything that does is on the index.</p>
  </header>
  <div class="index">
    <a class="entry" id="home" href="/">
      <span class="num">&larr;</span>
      <span><h2>Back to the index<span class="arrow" aria-hidden="true">&rarr;</span></h2></span>
      <span class="status">home</span>
    </a>
  </div>
</main>
<script>
  /* A project Pages site lives under /<repo>/, and this page is served for any
     depth beneath it, so the site root has to be worked out at runtime. */
  (function () {
    var root = '/';
    if (location.hostname.endsWith('github.io')) {
      var first = location.pathname.split('/')[1];
      if (first) root = '/' + first + '/';
    }
    document.getElementById('home').setAttribute('href', root);
  }());
</script>
</body>
</html>
